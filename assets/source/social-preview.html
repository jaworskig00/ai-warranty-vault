<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source for docs/social-preview.png (1280×640). Rendered by render-icons.mjs from the
     README screenshots, so retaking those and re-running the script refreshes it. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{
    background:
      radial-gradient(900px 500px at 85% 20%, rgba(37,99,235,.28), transparent 60%),
      radial-gradient(700px 400px at 0% 100%, rgba(34,197,94,.10), transparent 60%),
      #0B1120;
    font-family: "Inter","Noto Sans","DejaVu Sans",system-ui,sans-serif;
    color:#F8FAFC; position:relative;
  }
  .left{position:absolute;left:80px;top:0;bottom:0;width:500px;display:flex;flex-direction:column;justify-content:center;gap:26px}
  .brand{display:flex;align-items:center;gap:20px}
  h1{font-size:60px;line-height:1.02;font-weight:800;letter-spacing:-1.5px}
  .tag{font-size:25px;line-height:1.35;color:#CBD5E1;font-weight:500}
  .tag b{color:#F8FAFC;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
  .chip{font-size:17px;font-weight:600;color:#BFDBFE;background:#111A2E;border:1px solid #25304A;border-radius:999px;padding:7px 14px}
  .phones{position:absolute;right:52px;top:0;bottom:0;width:600px}
  .phone{position:absolute;width:236px;border-radius:30px;border:6px solid #1B2740;box-shadow:0 30px 60px rgba(0,0,0,.55);overflow:hidden;background:#0B1120}
  .phone img{display:block;width:100%}
  .p1{left:0;top:96px;transform:rotate(-7deg)}
  .p2{left:182px;top:48px;z-index:2}
  .p3{left:364px;top:96px;transform:rotate(7deg)}
</style></head>
<body>
  <div class="left">
    <div class="brand">
      <svg width="74" height="86" viewBox="0 0 74 86" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/>
          </linearGradient>
        </defs>
        <path d="M37 3 L69 15 V41 C69 62 55 77 37 83 C19 77 5 62 5 41 V15 Z" fill="url(#g)" stroke="#93C5FD" stroke-width="2.5"/>
        <path d="M24 43 L33 52 L51 33" fill="none" stroke="#F8FAFC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>AI Warranty<br>Vault</h1>
    </div>
    <p class="tag">Snap a receipt, <b>track every warranty</b>, and ask your product's manuals — answers cite the page.</p>
    <div class="chips">
      <span class="chip">Expo · React Native</span>
      <span class="chip">Supabase · RLS</span>
      <span class="chip">pgvector</span>
      <span class="chip">LangGraph</span>
      <span class="chip">Claude vision</span>
    </div>
  </div>
  <div class="phones">
    <div class="phone p1"><img src="../../docs/screenshots/vault.png"></div>
    <div class="phone p2"><img src="../../docs/screenshots/ask-citation.png"></div>
    <div class="phone p3"><img src="../../docs/screenshots/product-detail.png"></div>
  </div>
</body></html>
