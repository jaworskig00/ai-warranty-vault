name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — lint, typecheck, jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # React 19 peer ranges conflict on Expo SDK 57; see AGENTS.md.
      - run: npm ci --legacy-peer-deps

      - run: npm run lint

      # Note: typed routes are generated by the Expo dev server into .expo/, which a
      # clean runner does not have, so route strings are checked permissively here.
      - run: npm run typecheck

      - run: npm test -- --ci

  ai:
    name: AI service — pytest on Postgres + pgvector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ai

    # The suite applies the real migrations from supabase/migrations to this
    # database, so RLS, triggers and the search function are tested as shipped.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # No secrets: tests/conftest.py forces PROVIDER_MODE=mock, so no test can reach
    # a real model or embedding provider.
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: services/ai/.python-version
          cache: pip
          cache-dependency-path: services/ai/requirements.lock.txt

      - run: pip install -r requirements.lock.txt

      - run: python -m pytest
